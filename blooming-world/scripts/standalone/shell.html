<!-- Волна 5: регистрация service worker (только http/https; в file:// тихо пропускается) -->
<script>
(function () {
  try {
    if ('serviceWorker' in navigator) {
      var proto = location.protocol;
      var local = ['localhost', '127.0.0.1', '0.0.0.0'].indexOf(location.hostname) !== -1;
      if (proto === 'https:' || (proto === 'http:' && local)) {
        navigator.serviceWorker.register('sw.js').catch(function () {});
      }
    }
  } catch (e) { /* no-op */ }
})();
</script>
