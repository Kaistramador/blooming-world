<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Цветущий мир — Blooming World</title>
<meta name="description" content="Match-3 игра «Цветущий мир»: 100 уровней в 10 эрах графики. Автономная версия — один HTML-файл.">
<style>
/* ============================================================
 * Blooming World — standalone single-file edition styles
 * (port of the Next.js/Tailwind UI + globals.css animations)
 * ============================================================ */
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; }
body {
  font-family: ui-rounded, 'Segoe UI', 'Noto Sans', system-ui, -apple-system, sans-serif;
  background: #14532d;
  color: #fff;
  min-height: 100vh;
  overflow-x: hidden;
  user-select: none;
}
button { font-family: inherit; border: 0; cursor: pointer; background: none; color: inherit; }
input { font-family: inherit; }

.app { position: relative; min-height: 100vh; overflow: hidden; }
.screen { position: relative; z-index: 10; }

/* ---------- blooming background ---------- */
.bg-layer { position: absolute; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
.bg-layer.as-root { position: fixed; }
.bg-ground { position: absolute; left: 0; right: 0; bottom: 0; height: 26%; border-radius: 100% 100% 0 0 / 18% 18% 0 0; }
.bg-hill { position: absolute; bottom: 20%; width: 130%; height: 30%; border-radius: 100% 100% 0 0 / 60% 60% 0 0; }
.bg-hill.near { bottom: 22%; }
.bg-sun { position: absolute; top: 7%; right: 10%; width: 72px; height: 72px; border-radius: 50%;
  background: radial-gradient(circle, #fff7cf 0%, #ffd94e 55%, rgba(255,200,60,.15) 72%, transparent 76%);
  animation: bm-sun-rays 5s ease-in-out infinite; }
.bg-rays { position: absolute; top: 4%; right: 4%; width: 200px; height: 200px;
  background: repeating-conic-gradient(from 0deg, rgba(255,240,170,.14) 0deg 9deg, transparent 9deg 22deg);
  border-radius: 50%; filter: blur(1px); animation: bm-sun-rays 6s ease-in-out infinite; }
.bg-cloud { position: absolute; width: 130px; height: 36px; border-radius: 40px;
  background: rgba(255,255,255,.8); box-shadow: 0 8px 0 -2px rgba(255,255,255,.65), 22px -12px 0 -4px rgba(255,255,255,.7); opacity: .8;
  animation: bm-cloud-drift linear infinite; }
.bg-star { position: absolute; width: 3px; height: 3px; border-radius: 50%; background: #fff;
  animation: bm-star-twinkle 3s ease-in-out infinite; }
.bg-tree { position: absolute; bottom: 20%; width: 46px; height: 74px; transform-origin: bottom center;
  animation: bm-tree-sway 4s ease-in-out infinite; }
.bg-tree::before { content: ''; position: absolute; left: 50%; bottom: 0; width: 8px; height: 40%; transform: translateX(-50%);
  background: #6b4a2c; border-radius: 3px; }
.bg-tree::after { content: ''; position: absolute; left: 50%; bottom: 34%; transform: translateX(-50%);
  width: 58px; height: 64px; border-radius: 50% 50% 46% 46%; background: var(--tree, #2e8a4e);
  box-shadow: inset -8px -6px 0 rgba(0,0,0,.12); }
.bg-bush { position: absolute; bottom: 21%; width: 52px; height: 30px; border-radius: 26px 26px 14px 14px;
  background: var(--bush, #3da05a); box-shadow: inset -6px -4px 0 rgba(0,0,0,.12); }
.bg-flower { position: absolute; bottom: 21%; width: 14px; height: 14px; border-radius: 50%;
  background: var(--fl, #ff8ab0); box-shadow: 0 0 0 3px var(--flc, rgba(255,255,255,.25)), inset 0 -2px 2px rgba(0,0,0,.18); }
.bg-flower::after { content: ''; position: absolute; left: 50%; top: 50%; width: 5px; height: 5px; border-radius: 50%;
  transform: translate(-50%,-50%); background: #fff8d8; }
.bg-butterfly { position: absolute; width: 16px; height: 12px; animation: bm-butterfly 9s ease-in-out infinite; }
.bg-butterfly::before, .bg-butterfly::after { content: ''; position: absolute; top: 0; width: 8px; height: 12px; border-radius: 60% 60% 40% 40%;
  background: var(--bf, #ffd166); opacity: .9; }
.bg-butterfly::before { left: 0; transform: skewY(-12deg); }
.bg-butterfly::after { right: 0; transform: skewY(12deg); }
.bg-petal { position: absolute; top: -5vh; width: 12px; height: 12px; border-radius: 60% 0 60% 0;
  background: var(--pt, #ffb0c8); opacity: .85; animation: bm-petal-fall linear infinite; }
.bg-firefly { position: absolute; width: 6px; height: 6px; border-radius: 50%;
  background: radial-gradient(circle, #eaff9a, rgba(180,255,120,.1) 70%);
  animation: bm-firefly 4.5s ease-in-out infinite; }
.bg-sparkle { position: absolute; font-size: 12px; color: #fff; opacity: .7; animation: bm-sparkle 3s ease-in-out infinite; }
.bg-moon { position: absolute; top: 8%; right: 12%; width: 60px; height: 60px; border-radius: 50%;
  background: radial-gradient(circle at 35% 35%, #f4f0ff, #c9c2e8 60%, rgba(150,140,200,.2) 75%, transparent 80%); }

/* ---------- tile animations (ported 1:1) ---------- */
@keyframes bm-pop { 0% { transform: scale(1); opacity: 1; } 40% { transform: scale(1.25) rotate(6deg); opacity: 1; } 100% { transform: scale(0) rotate(20deg); opacity: 0; } }
@keyframes bm-fall-in { 0% { transform: translateY(-120%) scale(0.6); opacity: 0.4; } 70% { transform: translateY(0) scale(1.04); opacity: 1; } 100% { transform: translateY(0) scale(1); opacity: 1; } }
@keyframes bm-born { 0% { transform: scale(0.3) rotate(-30deg); } 60% { transform: scale(1.25) rotate(8deg); } 100% { transform: scale(1) rotate(0); } }
@keyframes bm-wobble { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-4%); } }
@keyframes bm-shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-6%); } 75% { transform: translateX(6%); } }
@keyframes bm-shine { 0% { transform: translateX(-180%) skewX(-18deg); } 100% { transform: translateX(280%) skewX(-18deg); } }
@keyframes bm-special-pulse { 0%, 100% { filter: brightness(1); transform: scale(1); } 50% { filter: brightness(1.35); transform: scale(1.06); } }
@keyframes bm-rainbow-spin { 0% { filter: hue-rotate(0deg); } 100% { filter: hue-rotate(360deg); } }
@keyframes bm-stone-hit { 0%, 100% { transform: translate(0); } 30% { transform: translate(-4%, 2%); } 60% { transform: translate(4%, -2%); } }
@keyframes bm-particle { 0% { transform: translate(0, 0) scale(1); opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)) scale(0.2) rotate(var(--rot)); opacity: 0; } }
@keyframes bm-star-pop { 0% { transform: scale(0) rotate(-90deg); opacity: 0; } 70% { transform: scale(1.35) rotate(8deg); opacity: 1; } 100% { transform: scale(1) rotate(0); opacity: 1; } }
@keyframes bm-float-up { 0% { transform: translateY(0); opacity: 1; } 100% { transform: translateY(-160%); opacity: 0; } }
@keyframes bm-toast-in { 0% { transform: translateY(-16px); opacity: 0; } 100% { transform: translateY(0); opacity: 1; } }
@keyframes bm-cloud-drift { 0% { transform: translateX(-15vw); } 100% { transform: translateX(115vw); } }
@keyframes bm-petal-fall { 0% { transform: translate(0, -8vh) rotate(0deg); opacity: 0; } 10% { opacity: 0.9; } 100% { transform: translate(var(--drift, 4vw), 108vh) rotate(320deg); opacity: 0; } }
@keyframes bm-butterfly { 0% { transform: translate(0, 0) rotate(0deg); } 25% { transform: translate(3vw, -2vh) rotate(8deg); } 50% { transform: translate(6vw, 1vh) rotate(-6deg); } 75% { transform: translate(2vw, 3vh) rotate(5deg); } 100% { transform: translate(0, 0) rotate(0deg); } }
@keyframes bm-firefly { 0%, 100% { opacity: 0.1; transform: translate(0, 0); } 50% { opacity: 1; transform: translate(1.5vw, -2vh); } }
@keyframes bm-sparkle { 0%, 100% { opacity: 0; transform: scale(0.4); } 50% { opacity: 1; transform: scale(1.15); } }
@keyframes bm-sun-rays { 0%, 100% { opacity: 0.5; } 50% { opacity: 0.85; } }
@keyframes bm-star-twinkle { 0%, 100% { opacity: 0.25; } 50% { opacity: 1; } }
@keyframes bm-tree-sway { 0%, 100% { transform: rotate(-1.6deg); } 50% { transform: rotate(1.6deg); } }

.bm-pop { animation: bm-pop 0.24s ease-in forwards; }
.bm-fall-in { animation: bm-fall-in 0.26s cubic-bezier(.3,.7,.4,1.1); }
.bm-born { animation: bm-born 0.3s cubic-bezier(.3,1.4,.5,1); }
.bm-wobble { animation: bm-wobble 2.4s ease-in-out infinite; }
.bm-shake { animation: bm-shake 0.28s ease-in-out 2; }
.bm-stone-hit { animation: bm-stone-hit 0.3s ease-in-out; }
.bm-special-pulse { animation: bm-special-pulse 1.4s ease-in-out infinite; }
.bm-rainbow-spin { animation: bm-rainbow-spin 2.5s linear infinite; }
.bm-particle { position: absolute; pointer-events: none; z-index: 30; animation: bm-particle 0.65s ease-out forwards; will-change: transform, opacity; }
.bm-star-pop { animation: bm-star-pop 0.45s cubic-bezier(.3,1.5,.5,1) backwards; }
.bm-float-up { animation: bm-float-up 0.9s ease-out forwards; }
.bm-toast-in { animation: bm-toast-in 0.25s ease-out; }
.bm-shine-wrap { position: absolute; inset: 0; overflow: hidden; pointer-events: none; }
.bm-shine-bar { position: absolute; top: -20%; bottom: -20%; width: 34%; background: linear-gradient(90deg, transparent, rgba(255,255,255,.55), transparent); animation: bm-shine 2.6s ease-in-out infinite; }
.bm-pixel-pattern { position: absolute; inset: 0; background-image: repeating-linear-gradient(45deg, rgba(0,0,0,.06) 0 4px, transparent 4px 8px), repeating-linear-gradient(-45deg, rgba(255,255,255,.05) 0 4px, transparent 4px 8px); }
.bm-checker-light { background-image: linear-gradient(45deg, rgba(255,255,255,.06) 25%, transparent 25%, transparent 75%, rgba(255,255,255,.06) 75%); background-size: 24px 24px; }
.bm-text-outline { text-shadow: 0 1px 2px rgba(0,0,0,.5), 0 0 6px rgba(0,0,0,.25); }

/* ---------- shared ui ---------- */
.card { background: rgba(0,0,0,.25); backdrop-filter: blur(4px); border: 2px solid rgba(255,255,255,.22); border-radius: 22px; }
.btn { border-radius: 999px; padding: 10px 18px; font-weight: 800; font-size: 14px; transition: filter .15s, transform .05s; }
.btn:active { transform: scale(.97); }
.btn-primary { background: linear-gradient(90deg, #10b981, #14b8a6); color: #fff; box-shadow: 0 4px 14px rgba(0,0,0,.3); }
.btn-amber { background: #fbbf24; color: #451a03; box-shadow: 0 4px 12px rgba(0,0,0,.25); }
.btn-ghost { background: rgba(255,255,255,.25); color: #fff; }
.btn-white { background: #fff; color: #047857; }
.btn-dark { background: rgba(0,0,0,.35); color: #fff; }
.chip { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 12px; font-size: 12px; font-weight: 700; background: rgba(0,0,0,.32); color: #fff; }
.chip.done { background: rgba(16,185,129,.9); }
.coin-pill { display: inline-flex; align-items: center; gap: 4px; background: rgba(251,191,36,.92); color: #451a03; border-radius: 999px; padding: 4px 12px; font-size: 14px; font-weight: 900; box-shadow: 0 2px 8px rgba(0,0,0,.25); }

/* ---------- bottom nav ---------- */
.bottom-nav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 40; border-top: 1px solid rgba(255,255,255,.2); background: rgba(0,0,0,.45); backdrop-filter: blur(8px); padding-bottom: env(safe-area-inset-bottom); }
.bottom-nav .row { max-width: 512px; margin: 0 auto; display: flex; justify-content: space-around; padding: 6px 8px; }
.nav-btn { display: flex; flex-direction: column; align-items: center; gap: 2px; min-height: 44px; min-width: 64px; border-radius: 16px; padding: 6px 12px; font-size: 10px; font-weight: 700; color: rgba(255,255,255,.75); }
.nav-btn.active { background: rgba(255,255,255,.95); color: #1e293b; box-shadow: 0 3px 10px rgba(0,0,0,.3); }
.nav-btn .ico { font-size: 18px; line-height: 1; }

/* ---------- map ---------- */
.map-wrap { max-width: 512px; margin: 0 auto; padding: 12px 12px 90px; }
.map-head { display: flex; align-items: flex-end; justify-content: space-between; margin-bottom: 12px; }
.map-head h1 { margin: 0; font-size: 24px; font-weight: 900; letter-spacing: -0.02em; }
.map-head p { margin: 0; font-size: 12px; opacity: .85; }
.chapter-card { position: relative; overflow: hidden; border-radius: 26px; border: 2px solid rgba(255,255,255,.25); box-shadow: 0 6px 20px rgba(0,0,0,.3); margin-bottom: 12px; }
.chapter-card.locked { opacity: .7; filter: saturate(0); }
.chapter-inner { position: relative; z-index: 10; padding: 12px; }
.chapter-kicker { font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: .08em; opacity: .85; }
.chapter-name { font-size: 18px; font-weight: 900; }
.chapter-tag { font-size: 11px; opacity: .9; }
.bloomed-pill { background: rgba(255,255,255,.85); color: #047857; border-radius: 999px; padding: 4px 10px; font-size: 12px; font-weight: 900; }
.levels-grid { margin-top: 10px; display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.level-btn { display: flex; flex-direction: column; align-items: center; border-radius: 16px; padding: 6px 0; font-size: 12px; font-weight: 900; }
.level-btn.open { background: rgba(255,255,255,.88); color: #334155; }
.level-btn.open:hover { background: #fff; }
.level-btn.current { background: #fbbf24; color: #451a03; box-shadow: 0 0 0 2px #fff, 0 4px 12px rgba(0,0,0,.3); }
.level-btn.locked { background: rgba(0,0,0,.4); color: rgba(255,255,255,.5); cursor: not-allowed; }
.level-stars { font-size: 9px; line-height: 1.2; color: #f59e0b; }

/* ---------- game ---------- */
.game-wrap { max-width: 512px; margin: 0 auto; padding: 8px 12px 10px; display: flex; flex-direction: column; min-height: 100vh; }
.game-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.game-title { font-size: 14px; font-weight: 800; text-align: center; }
.boss-badge { display: block; font-size: 10px; font-weight: 900; letter-spacing: .18em; color: #fcd34d; }
.stats-row { margin-top: 8px; display: flex; gap: 8px; }
.stat-box { flex: 1; border-radius: 16px; background: rgba(0,0,0,.25); backdrop-filter: blur(3px); padding: 5px 12px; }
.stat-box .lbl { font-size: 10px; text-transform: uppercase; letter-spacing: .05em; opacity: .7; }
.stat-box .val { font-size: 20px; font-weight: 900; line-height: 1.1; }
.goals-row { margin-top: 8px; display: flex; flex-wrap: wrap; gap: 6px; }
.board-outer { margin-top: 12px; display: flex; justify-content: center; }
.board-box { position: relative; width: 100%; max-width: 480px; border-radius: 26px; padding: 10px; border: 2px solid rgba(255,255,255,.22); }
.board-inner { position: relative; }
.cell { position: absolute; padding: 3%; }
.cell button { width: 100%; height: 100%; transition: transform .15s, filter .15s; display: block; padding: 0; }
.cell button.sel { transform: scale(1.1); filter: brightness(1.2) drop-shadow(0 0 6px rgba(255,255,255,.8)); z-index: 5; position: relative; }
.cell.void-cell { padding: 0; }
.void-dot { position: absolute; inset: 8%; border-radius: 15%; background: rgba(0,0,0,.1); }
.tile-root { position: relative; width: 100%; height: 100%; }
.tile-rim { position: absolute; }
.tile-body { position: absolute; inset: 6%; overflow: hidden; }
.tile-over { position: absolute; inset: 6%; z-index: 10; display: flex; align-items: center; justify-content: center; pointer-events: none; }
.tile-glyph { font-size: 50cqw; line-height: 1; filter: drop-shadow(0 1px 2px rgba(0,0,0,.45)); }
.spec-disc { width: 58%; height: 58%; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: rgba(16,12,22,.52); }
.spec-glyph { font-size: 34cqw; font-weight: 900; color: #fff; text-shadow: 0 0 3px rgba(0,0,0,.8), 0 1px 2px rgba(0,0,0,.55); }
.stone-wrap { position: relative; width: 100%; height: 100%; }
.stone-pips { position: absolute; left: 0; right: 0; bottom: 7%; display: flex; justify-content: center; gap: 6%; z-index: 5; }
.stone-pips span { width: 11%; aspect-ratio: 1; border-radius: 50%; background: rgba(16,20,26,.6); box-shadow: 0 0 0 1px rgba(255,255,255,.4); }
.hint-line { margin-top: 8px; text-align: center; font-size: 11px; opacity: .78; }
.boosters-row { margin-top: 6px; display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
.booster-btn { position: relative; display: flex; align-items: center; justify-content: center; border-radius: 16px; padding: 7px 0; font-size: 20px; background: rgba(0,0,0,.32); transition: background .15s; }
.booster-btn:hover { background: rgba(0,0,0,.45); }
.booster-btn.active { background: #fbbf24; color: #451a03; box-shadow: 0 0 0 2px #fff; }
.booster-count { position: absolute; right: -4px; top: -4px; min-width: 18px; border-radius: 999px; padding: 0 4px; font-size: 10px; font-weight: 900; line-height: 18px; color: #fff; }
.booster-count.has { background: #10b981; }
.booster-count.zero { background: rgba(244,63,94,.9); }
.cancel-row { margin-top: 6px; text-align: center; }
.float-txt { position: absolute; z-index: 20; transform: translateX(-50%); white-space: nowrap; font-size: 14px; font-weight: 900; color: #fff; text-shadow: 0 1px 3px rgba(0,0,0,.6); pointer-events: none; }
.toast-wrap { position: fixed; left: 50%; top: 64px; transform: translateX(-50%); z-index: 60; }
.toast-box { background: rgba(0,0,0,.8); border-radius: 999px; padding: 8px 18px; font-size: 14px; font-weight: 700; box-shadow: 0 6px 18px rgba(0,0,0,.4); }

/* ---------- modals ---------- */
.modal-overlay { position: fixed; inset: 0; z-index: 70; background: rgba(0,0,0,.55); display: flex; align-items: center; justify-content: center; padding: 16px; }
.modal { width: 100%; max-width: 330px; border-radius: 26px; padding: 18px; text-align: center; box-shadow: 0 20px 60px rgba(0,0,0,.5); }
.modal.win { background: linear-gradient(180deg, #10b981, #0d9488); }
.modal.lose { background: linear-gradient(180deg, #334155, #0f172a); }
.modal.light { background: #fff; color: #1e293b; }
.modal h2 { margin: 0 0 6px; font-size: 22px; font-weight: 900; }
.modal .stars-row { display: flex; justify-content: center; gap: 8px; font-size: 36px; margin: 8px 0; }
.modal .stars-row .dim { opacity: .25; filter: grayscale(1); }
.modal .sub { font-size: 13px; margin: 4px 0; }
.modal .reward-pill { display: inline-block; background: rgba(251,191,36,.92); color: #451a03; border-radius: 999px; padding: 6px 16px; font-weight: 900; margin-top: 6px; }
.modal .col { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
.modal .row2 { display: flex; gap: 8px; }

/* ---------- shop / ranks / profile ---------- */
.panel-wrap { max-width: 512px; margin: 0 auto; padding: 12px 12px 90px; }
.panel-title { font-size: 22px; font-weight: 900; margin: 0 0 4px; }
.tabs-row { display: flex; gap: 6px; overflow-x: auto; margin: 10px 0; padding-bottom: 2px; }
.tab-btn { flex-shrink: 0; border-radius: 999px; padding: 7px 14px; font-size: 12px; font-weight: 800; background: rgba(0,0,0,.32); color: rgba(255,255,255,.85); }
.tab-btn.active { background: #fff; color: #1e293b; }
.shop-item { display: flex; align-items: center; gap: 10px; border-radius: 20px; background: rgba(0,0,0,.28); border: 1px solid rgba(255,255,255,.18); padding: 10px 12px; margin-bottom: 8px; }
.shop-item .info { flex: 1; min-width: 0; }
.shop-item .nm { font-size: 14px; font-weight: 800; }
.shop-item .ds { font-size: 11px; opacity: .75; }
.shop-item .pr { font-size: 12px; font-weight: 900; color: #fcd34d; white-space: nowrap; }
.skins-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.skin-card { border-radius: 18px; background: rgba(0,0,0,.28); border: 1px solid rgba(255,255,255,.18); padding: 10px 8px; text-align: center; }
.skin-card.equipped { border-color: #fbbf24; box-shadow: 0 0 0 1px #fbbf24; }
.skin-preview { display: grid; grid-template-columns: repeat(3, 1fr); gap: 4px; justify-items: center; margin-bottom: 8px; }
.skin-tile { width: 26px; height: 26px; position: relative; container-type: size; }
.skin-tile .tile-rim { position: absolute; }
.skin-tile .tile-body { position: absolute; inset: 8%; overflow: hidden; }
.skin-tile .tile-glyph { font-size: 50cqw; }
.rank-podium { display: flex; gap: 6px; align-items: flex-end; justify-content: center; margin: 12px 0; }
.rank-podium .pod { flex: 1; border-radius: 16px 16px 6px 6px; background: rgba(0,0,0,.32); padding: 8px 4px; text-align: center; font-size: 11px; }
.rank-podium .pod .em { font-size: 22px; }
.rank-row { display: flex; align-items: center; gap: 10px; border-radius: 14px; padding: 7px 10px; margin-bottom: 4px; background: rgba(0,0,0,.24); font-size: 13px; }
.rank-row.me { background: rgba(251,191,36,.9); color: #451a03; font-weight: 900; }
.rank-row .pos { width: 34px; font-weight: 900; opacity: .8; }
.rank-row .nm { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.search-input { width: 100%; border-radius: 999px; border: 1px solid rgba(255,255,255,.3); background: rgba(0,0,0,.3); color: #fff; padding: 9px 16px; font-size: 14px; outline: none; margin-bottom: 10px; }
.profile-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
.avatar-bubble { width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 32px; }
.stat-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 8px; }
.stat-card { border-radius: 18px; background: rgba(0,0,0,.28); border: 1px solid rgba(255,255,255,.16); padding: 10px 12px; }
.stat-card .v { font-size: 20px; font-weight: 900; }
.stat-card .k { font-size: 11px; opacity: .75; }

/* ---------------- level generator (100 levels / 10 chapters) ---------------- */
const TOTAL_LEVELS = 100;
const CHAPTER_SIZE = 10;
const TOTAL_CHAPTERS = TOTAL_LEVELS / CHAPTER_SIZE;
function chapterOfLevel(level) {
  return Math.min(TOTAL_CHAPTERS - 1, Math.floor((level - 1) / CHAPTER_SIZE));
}
function generateStones(rng, w, h, count, maxHp, avoidBottomRows) {
  const stones = [];
  const used = new Set();
  let guard = 0;
  while (stones.length < count && guard++ < 200) {
    const r = Math.floor(rng() * (h - avoidBottomRows));
    const c = Math.floor(rng() * w);
    const i = r * w + c;
    if (used.has(i)) continue;
    used.add(i);
    const hp = maxHp <= 1 ? 1 : 1 + Math.floor(rng() * maxHp);
    stones.push({ idx: i, hp: Math.min(hp, maxHp) });
  }
  return stones;
}
function getLevelConfig(level) {
  const lv = Math.max(1, Math.min(TOTAL_LEVELS, level));
  const chapter = chapterOfLevel(lv);
  const rng = mulberry32(lv * 9176 + 11);
  const isBoss = lv % CHAPTER_SIZE === 0;
  const w = lv <= 3 ? 7 : 8;
  const h = lv <= 3 ? 7 : 8;
  const colors = lv <= 5 ? 4 : lv <= 20 ? 5 : 6;
  const moves = isBoss
    ? 26 + (rng() < 0.5 ? 0 : 1)
    : Math.max(22, 30 - Math.round(chapter * 0.8) - (rng() < 0.3 ? 1 : 0));
  let stones = [];
  if (!isBoss && chapter >= 2) {
    const base = Math.min(18, 4 + (chapter - 2) * 3);
    const extra = lv % 7 === 0 ? 6 : 0;
    const maxHp = lv >= 45 ? 2 : 1;
    stones = generateStones(rng, w, h, base + extra, maxHp, 2);
  } else if (isBoss && chapter >= 4) {
    stones = generateStones(rng, w, h, Math.min(10, chapter - 2), 1, 2);
  }
  const isItemLevel = !isBoss && chapter >= 3 && lv % 8 === 5;
  const items = isItemLevel ? 2 + Math.floor(chapter / 2) : 0;
  if (isItemLevel) stones = stones.filter((s) => Math.floor(s.idx / w) < h - 1);
  const voids = [];
  if (!isBoss && chapter >= 4) {
    const voidCount = Math.min(8, 2 + (chapter - 4));
    let guard = 0;
    while (voids.length < voidCount && guard++ < 100) {
      const r = Math.floor(rng() * h);
      const c = Math.floor(rng() * w);
      if (r === h - 1) continue;
      const i = r * w + c;
      if (stones.some((s) => s.idx === i)) continue;
      if (!voids.includes(i)) voids.push(i);
    }
  }
  const goals = [];
  const targetScore = Math.round(moves * (isBoss ? 30 + chapter * 2 : 42 + chapter * 3));
  const target2 = Math.round(targetScore * 1.6);
  const target3 = Math.round(targetScore * 2.4);
  const colorCount = Math.max(8, Math.round(moves * (0.5 + chapter * 0.03)));
  if (isBoss) {
    goals.push({ type: 'score', count: targetScore });
  } else if (lv <= 5) {
    goals.push({ type: 'collect', color: Math.floor(rng() * colors), count: Math.max(6, Math.round(colorCount * 0.6)) });
  } else if (lv % 7 === 0 && chapter >= 2) {
    goals.push({ type: 'stone', count: stones.length });
    goals.push({ type: 'score', count: Math.round(targetScore * 0.7) });
  } else if (isItemLevel) {
    goals.push({ type: 'item', count: items });
  } else if (lv % 9 === 4) {
    goals.push({ type: 'score', count: targetScore });
  } else if (chapter >= 2 && lv % 3 === 0) {
    const c1 = Math.floor(rng() * colors);
    let c2 = Math.floor(rng() * colors);
    if (c2 === c1) c2 = (c1 + 3) % colors;
    goals.push({ type: 'collect', color: c1, count: colorCount });
    goals.push({ type: 'collect', color: c2, count: Math.round(colorCount * 0.75) });
  } else {
    goals.push({ type: 'collect', color: Math.floor(rng() * colors), count: colorCount });
    goals.push({ type: 'score', count: Math.round(targetScore * 0.75) });
  }
  return { level: lv, chapter, w, h, colors, moves, mode: isBoss ? 'tap' : 'swap', goals, stones, voids, items, targetScore, star2: target2, star3: target3 };
}

function botLevel(rng) {
  const u = rng();
  if (u < 0.30) return 1 + Math.floor(rng() * 30);
  if (u < 0.55) return 30 + Math.floor(rng() * 120);
  if (u < 0.75) return 150 + Math.floor(rng() * 400);
  if (u < 0.88) return 550 + Math.floor(rng() * 900);
  if (u < 0.96) return 1450 + Math.floor(rng() * 2000);
  return 3450 + Math.floor(Math.pow(rng(), 2.2) * (TOTAL_LEVELS * 99));
}
function generateBots(count) {
  const n = count || 520;
  const rng = mulberry32(20261107);
  const bots = [];
  for (let i = 0; i < n; i++) {
    const level = botLevel(rng);
    const stars = Math.round(level * (1.6 + rng() * 1.3));
    const avatar = AVATARS[Math.floor(rng() * AVATARS.length)];
    const frame = FRAMES[Math.floor(rng() * FRAMES.length)];
    const style = NAME_STYLES[Math.floor(rng() * NAME_STYLES.length)];
    const nameFx = rng() < 0.3 ? ['ne-glow', 'ne-rainbow', 'ne-blink', 'ne-wave', 'ne-fire', 'ne-starlight'][Math.floor(rng() * 6)] : null;
    bots.push({ id: 'bot-' + i, name: botName(rng), level, stars, avatarId: avatar.id, frameId: frame.id, nameStyleId: style.id, nameEffectId: nameFx, isPlayer: false });

  return bots.sort((x, y) => y.level - x.level || y.stars - x.stars);
}

/* ============ engine.js ============ */
/* ============================================================
 * Bloom Match — match-3 engine (JS port of engine.ts, 1:1)
 * Swap-matches, cascades, specials (rocket H/V, bomb, rainbow),
 * combo swaps, stone blockers, drop items, tap-mode and boosters.
 * ============================================================ */

function mulberry32(seed) {
  let a = seed >>> 0;
  return function () {
    a |= 0;
    a = (a + 0x6d2b79f5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

let nextId = 1;
function resetIdCounter() { nextId = 1; }
function newId() { return nextId++; }

const EMPTY_MOVE = {
  valid: false, frames: [], score: 0, colorsCollected: [],
  itemsCollected: 0, stonesDestroyed: 0, maxCascade: 0, shuffled: false,
};

function cloneBoard(b) {
  return {
    w: b.w, h: b.h,
    cells: b.cells.map((c) =>
      c ? { tile: c.tile ? Object.assign({}, c.tile) : null, blocker: c.blocker ? Object.assign({}, c.blocker) : null } : null),
  };
}
function idxOf(b, r, c) { return r * b.w + c; }
function cellAt(b, r, c) {
  if (r < 0 || r >= b.h || c < 0 || c >= b.w) return null;
  return b.cells[r * b.w + c];
}
function isOpen(b, r, c) { return cellAt(b, r, c) !== null; }
function gemColor(b, r, c) {
  const cell = cellAt(b, r, c);
  if (!cell || !cell.tile) return -1;
  const t = cell.tile;
  if (t.kind !== 'gem' || t.color < 0) return -1;
  return t.color;
}
function tileAt(b, r, c) { const cell = cellAt(b, r, c); return cell ? cell.tile : null; }
function isMovable(t) { return !!t && t.kind === 'gem'; }

function findRuns(b) {
  const runs = [];
  for (let r = 0; r < b.h; r++) {
    let c = 0;
    while (c < b.w) {
      const col = gemColor(b, r, c);
      if (col < 0) { c++; continue; }
      let e = c + 1;
      while (e < b.w && gemColor(b, r, e) === col) e++;
      if (e - c >= 3) {
        const cells = [];
        for (let k = c; k < e; k++) cells.push(idxOf(b, r, k));
        runs.push({ cells, dir: 'h' });
      }
      c = e;
    }
  }
  for (let c = 0; c < b.w; c++) {
    let r = 0;
    while (r < b.h) {
      const col = gemColor(b, r, c);
      if (col < 0) { r++; continue; }
      let e = r + 1;
      while (e < b.h && gemColor(b, e, c) === col) e++;
      if (e - r >= 3) {
        const cells = [];
        for (let k = r; k < e; k++) cells.push(idxOf(b, k, c));
        runs.push({ cells, dir: 'v' });
      }
      r = e;
    }
  }
  return runs;
}

function groupify(runs) {
  const parent = new Map();
  const find = (x) => {
    let p = parent.get(x);
    if (p === undefined) { parent.set(x, x); p = x; }
    while (p !== parent.get(p)) p = parent.get(p);
    return p;
  };
  const union = (a, b) => {
    const ra = find(a), rb = find(b);
    if (ra !== rb) parent.set(ra, rb);
  };
  for (const run of runs) {
    for (const cell of run.cells) find(cell);
    for (let i = 1; i < run.cells.length; i++) union(run.cells[i - 1], run.cells[i]);
  }
  for (let i = 0; i < runs.length; i++) {
    for (let j = i + 1; j < runs.length; j++) {
      for (const a of runs[i].cells) {
        if (runs[j].cells.includes(a)) { union(runs[i].cells[0], runs[j].cells[0]); break; }
      }
    }
  }
  const groups = new Map();
  for (const run of runs) {
    for (const cell of run.cells) {
      const root = find(cell);
      let g = groups.get(root);
      if (!g) { g = { cells: [], maxH: 0, maxV: 0, hasH: false, hasV: false }; groups.set(root, g); }
      if (!g.cells.includes(cell)) g.cells.push(cell);
      const len = run.cells.length;
      if (run.dir === 'h') { g.hasH = true; g.maxH = Math.max(g.maxH, len); }
      else { g.hasV = true; g.maxV = Math.max(g.maxV, len); }
    }
  }
  return [...groups.values()];
}

function specialForGroup(g) {
  if (g.maxH >= 5 || g.maxV >= 5) return 'rainbow';
  if (g.hasH && g.hasV) return 'bomb';
  if (g.maxH === 4) return 'rocketH';
  if (g.maxV === 4) return 'rocketV';
  return 'none';
}

function makeTile(color, special, kind) {
  return { id: newId(), color, special: special || 'none', kind: kind || 'gem' };
}

function createBoard(cfg, rng) {
  resetIdCounter();
  const total = cfg.w * cfg.h;
  const cells = [];
  for (let i = 0; i < total; i++) cells.push(cfg.voids.includes(i) ? null : { tile: null, blocker: null });
  for (const s of cfg.stones) {
    if (cells[s.idx]) cells[s.idx] = { tile: null, blocker: { type: 'stone', hp: s.hp } };
  }
  const board = { w: cfg.w, h: cfg.h, cells };
  for (let r = 0; r < cfg.h; r++) {
    for (let c = 0; c < cfg.w; c++) {
      const cell = cellAt(board, r, c);
      if (!cell || cell.blocker) continue;
      const forbidden = new Set();
      const l1 = gemColor(board, r, c - 1), l2 = gemColor(board, r, c - 2);
      if (l1 >= 0 && l1 === l2) forbidden.add(l1);
      const u1 = gemColor(board, r - 1, c), u2 = gemColor(board, r - 2, c);
      if (u1 >= 0 && u1 === u2) forbidden.add(u1);
      let col = Math.floor(rng() * cfg.colors);
      let guard = 0;
      while (forbidden.has(col) && guard++ < 20) col = Math.floor(rng() * cfg.colors);
      cell.tile = makeTile(col);
    }
  }
  let tries = 0;
  while (!hasAnyMove(board, cfg.mode) && tries++ < 25) shuffleGems(board, rng);
  return board;
}

function compactColumns(b) {
  for (let c = 0; c < b.w; c++) {
    let segRows = [];
    const flush = () => {
      if (segRows.length === 0) return;
      let write = segRows[0];
      for (const r of segRows) {
        const cell = cellAt(b, r, c);
        if (cell.tile && write !== r) {
          const dest = cellAt(b, write, c);
          dest.tile = cell.tile;
          cell.tile = null;
        }
        write--;
      }
      segRows = [];
    };
    for (let r = b.h - 1; r >= 0; r--) {
      const cell = cellAt(b, r, c);
      if (!cell || cell.blocker) { flush(); continue; }
      segRows.push(r);
    }
    flush();
  }
}

function diagonalSlides(b, maxPass) {
  for (let pass = 0; pass < (maxPass || 12); pass++) {
    let moved = false;
    for (let r = 1; r < b.h; r++) {
      for (let c = 0; c < b.w; c++) {
        const cell = cellAt(b, r, c);
        if (!cell || cell.blocker || cell.tile) continue;
        const belowOpen = (cc) => {
          const bc = cellAt(b, r, cc);
          return !!bc && !bc.blocker;
        };
        for (const dc of [-1, 1]) {
          const sc = c + dc;
          if (sc < 0 || sc >= b.w) continue;
          const src = cellAt(b, r - 1, sc);
          if (!src || !src.tile || !isMovable(src.tile)) continue;
          if (belowOpen(sc)) continue;
          cell.tile = src.tile;
          src.tile = null;
          moved = true;
          break;
        }
      }
    }
    if (!moved) break;
  }
}

function applyGravity(b, cfg, rng, itemsLeft) {
  const spawnIds = [];
  const collectedIds = [];
  // 1) straight compaction inside segments
  compactColumns(b);
  // 2) diagonal slides
  diagonalSlides(b, 12);
  // 3) refill top empty stretches
  for (let c = 0; c < b.w; c++) {
    let filling = false;
    for (let r = 0; r < b.h; r++) {
      const cell = cellAt(b, r, c);
      if (!cell) continue;
      if (cell.blocker) { filling = false; continue; }
      if (!cell.tile) filling = true;
      if (filling && !cell.tile) {
        let tile;
        if (itemsLeft.n > 0 && rng() < 0.45) {
          tile = makeTile(-3, 'none', 'item');
          itemsLeft.n--;
        } else {
          tile = makeTile(Math.floor(rng() * cfg.colors));
        }
        cell.tile = tile;
        spawnIds.push(tile.id);
      }
    }
  }
  // 4) collect drop items reaching the bottom row
  let guard = 0;
  let collectedAny = true;
  while (collectedAny && guard++ < 8) {
    collectedAny = false;
    for (let c = 0; c < b.w; c++) {
      const cell = cellAt(b, b.h - 1, c);
      if (cell && cell.tile && cell.tile.kind === 'item') {
        collectedIds.push(cell.tile.id);
        cell.tile = null;
        collectedAny = true;
      }
    }
    if (collectedAny) {
      compactColumns(b);
      diagonalSlides(b, 6);
    }
  }
  return { spawnIds, collectedIds };
}

function mostCommonColor(b) {
  const counts = new Map();
  for (const cell of b.cells) {
    if (cell && cell.tile && cell.tile.kind === 'gem' && cell.tile.color >= 0) {
      counts.set(cell.tile.color, (counts.get(cell.tile.color) || 0) + 1);
    }
  }
  let best = 0, bestN = -1;
  for (const [col, n] of counts) {
    if (n > bestN) { bestN = n; best = col; }
  }
  return best;
}

function blastCellsFor(b, i) {
  const tile = b.cells[i] ? b.cells[i].tile : null;
  if (!tile) return [];
  const r = Math.floor(i / b.w);
  const c = i % b.w;
  const out = [];
  const push = (rr, cc) => {
    const cell = cellAt(b, rr, cc);
    if (cell) out.push(idxOf(b, rr, cc));
  };
  switch (tile.special) {
    case 'rocketH':
      for (let cc = 0; cc < b.w; cc++) push(r, cc);
      break;
    case 'rocketV':
      for (let rr = 0; rr < b.h; rr++) push(rr, c);
      break;
    case 'bomb':
      for (let rr = r - 1; rr <= r + 1; rr++)
        for (let cc = c - 1; cc <= c + 1; cc++) push(rr, cc);
      break;
    case 'rainbow': {
      const col = mostCommonColor(b);
      for (let rr = 0; rr < b.h; rr++)
        for (let cc = 0; cc < b.w; cc++)
          if (gemColor(b, rr, cc) === col) push(rr, cc);
      break;
    }
    default: break;
  }
  return out;
}

function runDetonations(b, st, queue, processed) {
  while (queue.length > 0) {
    const i = queue.pop();
    if (processed.has(i)) continue;
    processed.add(i);
    const tile = b.cells[i] ? b.cells[i].tile : null;
    if (!tile || tile.special === 'none') continue;
    st.detonations++;
    for (const j of blastCellsFor(b, i)) {
      const cell = b.cells[j];
      if (!cell) continue;
      if (cell.blocker) { st.stonesHit.add(j); continue; }
      if (!cell.tile) continue;
      if (cell.tile.kind === 'item') {
        if (!st.collectedIds.includes(cell.tile.id)) st.collectedIds.push(cell.tile.id);
        st.clearSet.add(j);
        continue;
      }
      st.clearSet.add(j);
      if (cell.tile.special !== 'none') queue.push(j);
    }
  }
}

function emptyAcc(itemsTotal) {
  return {
    valid: true, frames: [], score: 0, colorsCollected: [0, 0, 0, 0, 0, 0],
    itemsCollected: 0, stonesDestroyed: 0, maxCascade: 0, shuffled: false,
    itemsLeft: { n: itemsTotal },
  };
}

function hitAdjacentStones(b, st, clearSet) {
  for (const i of clearSet) {
    const r = Math.floor(i / b.w);
    const c = i % b.w;
    for (const [dr, dc] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) {
      const n = cellAt(b, r + dr, c + dc);
      if (n && n.blocker) st.stonesHit.add(idxOf(b, r + dr, c + dc));
    }
  }
}

function resolveCascade(startBoard, cfg, rng, acc, preferCell) {
  let b = startBoard;
  let cascade = 1;
  for (;;) {
    const runs = findRuns(b);
    if (runs.length === 0) break;
    const groups = groupify(runs);
    const st = { clearSet: new Set(), stonesHit: new Set(), collectedIds: [], detonations: 0 };
    const queue = [];
    const born = [];
    for (const g of groups) {
      const kind = specialForGroup(g);
      let spawnCell = null;
      if (kind !== 'none') {
        if (preferCell !== null && preferCell !== undefined && g.cells.includes(preferCell)) spawnCell = preferCell;
        else spawnCell = g.cells[Math.floor(g.cells.length / 2)];
      }
      for (const cellIdx of g.cells) {
        const tile = b.cells[cellIdx].tile;
        if (spawnCell !== null && cellIdx === spawnCell) { born.push({ idx: cellIdx, kind }); continue; }
        st.clearSet.add(cellIdx);
        if (tile.special !== 'none') queue.push(cellIdx);
      }
    }
    runDetonations(b, st, queue, new Set());
    hitAdjacentStones(b, st, st.clearSet);
    const clearedGems = [...st.clearSet].filter((i) => {
      const t = b.cells[i] ? b.cells[i].tile : null;
      return !!t && t.kind === 'gem';
    }).length;
    const points = clearedGems * 10 * cascade + st.detonations * 40 + born.length * 60;
    const display = cloneBoard(b);
    for (const bornSpec of born) {
      const t = display.cells[bornSpec.idx].tile;
      t.special = bornSpec.kind;
    }
    acc.frames.push({
      board: display,
      clearingIds: [...st.clearSet].map((i) => b.cells[i].tile.id),
      bornIds: born.map((x) => x.idx),
      spawnIds: [],
      collectedIds: st.collectedIds,
      stonesHit: [...st.stonesHit],
      points, cascade,
    });
    for (const bornSpec of born) {
      const cell = b.cells[bornSpec.idx];
      cell.tile.special = bornSpec.kind;
    }
    for (const i of st.clearSet) {
      const cell = b.cells[i];
      if (cell.tile && cell.tile.kind === 'item') acc.itemsCollected++;
      else if (cell.tile && cell.tile.kind === 'gem' && cell.tile.color >= 0) acc.colorsCollected[cell.tile.color]++;
      cell.tile = null;
    }
    for (const si of st.stonesHit) {
      const cell = b.cells[si];
      if (cell.blocker) {
        cell.blocker.hp--;
        if (cell.blocker.hp <= 0) { cell.blocker = null; acc.stonesDestroyed++; }
      }
    }
    acc.score += points;
    acc.maxCascade = Math.max(acc.maxCascade, cascade);
    const grav = applyGravity(b, cfg, rng, acc.itemsLeft);
    const itemPoints = grav.collectedIds.length * 100;
    acc.score += itemPoints;
    acc.itemsCollected += grav.collectedIds.length;
    acc.frames.push({
      board: cloneBoard(b), clearingIds: [], bornIds: [], spawnIds: grav.spawnIds,
      collectedIds: grav.collectedIds, stonesHit: [], points: itemPoints, cascade,
    });
    preferCell = null;
    cascade++;
  }
  if (!hasAnyMove(b, cfg.mode)) {
    shuffleGems(b, rng);
    acc.shuffled = true;
    acc.frames.push({
      board: cloneBoard(b), clearingIds: [], bornIds: [], spawnIds: [],
      collectedIds: [], stonesHit: [], points: 0, cascade: 0,
    });
  }
}

function applyBlastMove(board, cfg, rng, initialClear, initialQueue, basePoints, itemsTotal) {
  const acc = emptyAcc(itemsTotal);
  const b = board;
  const st = { clearSet: new Set(initialClear), stonesHit: new Set(), collectedIds: [], detonations: 0 };
  runDetonations(b, st, initialQueue, new Set());
  hitAdjacentStones(b, st, st.clearSet);
  const display = cloneBoard(b);
  acc.frames.push({
    board: display,
    clearingIds: [...st.clearSet].map((i) => b.cells[i].tile.id),
    bornIds: [], spawnIds: [], collectedIds: st.collectedIds,
    stonesHit: [...st.stonesHit], points: basePoints, cascade: 1,
  });
  for (const i of st.clearSet) {
    const cell = b.cells[i];
    if (cell.tile && cell.tile.kind === 'item') acc.itemsCollected++;
    else if (cell.tile && cell.tile.kind === 'gem' && cell.tile.color >= 0) acc.colorsCollected[cell.tile.color]++;
    cell.tile = null;
  }
  for (const si of st.stonesHit) {
    const cell = b.cells[si];
    if (cell.blocker) {
      cell.blocker.hp--;
      if (cell.blocker.hp <= 0) { cell.blocker = null; acc.stonesDestroyed++; }
    }
  }
  acc.score += basePoints + st.detonations * 40 + st.collectedIds.length * 100;
  const grav = applyGravity(b, cfg, rng, acc.itemsLeft);
  acc.score += grav.collectedIds.length * 100;
  acc.itemsCollected += grav.collectedIds.length;
  acc.frames.push({
    board: cloneBoard(b), clearingIds: [], bornIds: [], spawnIds: grav.spawnIds,
    collectedIds: grav.collectedIds, stonesHit: [], points: grav.collectedIds.length * 100, cascade: 1,
  });
  resolveCascade(b, cfg, rng, acc, null);
  return {
    valid: true, frames: acc.frames, score: acc.score, colorsCollected: acc.colorsCollected,
    itemsCollected: acc.itemsCollected, stonesDestroyed: acc.stonesDestroyed,
    maxCascade: Math.max(acc.maxCascade, 1), shuffled: acc.shuffled,
  };
}

function areAdjacent(b, a, d) {
  const ra = Math.floor(a / b.w), ca = a % b.w;
  const rd = Math.floor(d / b.w), cd = d % b.w;
  return Math.abs(ra - rd) + Math.abs(ca - cd) === 1;
}
function swapTiles(b, a, d) {
  const ca = b.cells[a], cd = b.cells[d];
  const t = ca.tile;
  ca.tile = cd.tile;
  cd.tile = t;
}
function createsMatchAfterSwap(board, a, d) {
  const b = cloneBoard(board);
  swapTiles(b, a, d);
  return findRuns(b).length > 0;
}
function swapCreatesMatch(board, a, d) { return createsMatchAfterSwap(board, a, d); }

function trySwap(board, a, d, cfg, rng) {
  if (!areAdjacent(board, a, d)) return EMPTY_MOVE;
  const ca = board.cells[a], cd = board.cells[d];
  if (!ca || !cd || !ca.tile || !cd.tile) return EMPTY_MOVE;
  if (!isMovable(ca.tile) || !isMovable(cd.tile)) return EMPTY_MOVE;

  const ta = ca.tile, td = cd.tile;
  const acc = emptyAcc(cfg.items);

  // rainbow combinations
  if (ta.special === 'rainbow' || td.special === 'rainbow') {
    const b = cloneBoard(board);
    swapTiles(b, a, d);
    acc.frames.push({ board: cloneBoard(b), clearingIds: [], bornIds: [], spawnIds: [], collectedIds: [], stonesHit: [], points: 0, cascade: 0 });
    const rIdx = ta.special === 'rainbow' ? d : a;
    const otherIdx = ta.special === 'rainbow' ? a : d;
    const other = b.cells[otherIdx].tile;
    const st = { clearSet: new Set([rIdx, otherIdx]), stonesHit: new Set(), collectedIds: [], detonations: 0 };
    const queue = [];
    if (other.special === 'rainbow') {
      for (let i = 0; i < b.cells.length; i++) {
        const cell = b.cells[i];
        if (cell && cell.tile && cell.tile.kind === 'gem') {
          st.clearSet.add(i);
          if (cell.tile.special !== 'none') queue.push(i);
        }
      }
    } else if (other.special !== 'none') {
      for (const j of blastCellsFor(b, otherIdx)) st.clearSet.add(j);
      for (let i = 0; i < b.cells.length; i++) {
        const cell = b.cells[i];
        if (cell && cell.tile && cell.tile.kind === 'gem' && cell.tile.color === other.color) st.clearSet.add(i);
      }
      queue.push(otherIdx);
    } else {
      for (let i = 0; i < b.cells.length; i++) {
        const cell = b.cells[i];
        if (cell && cell.tile && cell.tile.kind === 'gem' && cell.tile.color === other.color) {
          st.clearSet.add(i);
          if (cell.tile.special !== 'none') queue.push(i);
        }
      }
    }
    runDetonations(b, st, queue, new Set());
    acc.frames.push({
      board: cloneBoard(b), clearingIds: [...st.clearSet].map((i) => b.cells[i].tile.id),
      bornIds: [], spawnIds: [], collectedIds: st.collectedIds, stonesHit: [...st.stonesHit],
      points: st.clearSet.size * 15, cascade: 1,
    });
    for (const i of st.clearSet) {
      const cell = b.cells[i];
      if (cell.tile && cell.tile.kind === 'item') acc.itemsCollected++;
      else if (cell.tile && cell.tile.kind === 'gem' && cell.tile.color >= 0) acc.colorsCollected[cell.tile.color]++;
      cell.tile = null;
    }
    for (const si of st.stonesHit) {
      const cell = b.cells[si];
      if (cell.blocker) {
        cell.blocker.hp--;
        if (cell.blocker.hp <= 0) { cell.blocker = null; acc.stonesDestroyed++; }
      }
    }
    acc.score += st.clearSet.size * 15;
    const grav = applyGravity(b, cfg, rng, acc.itemsLeft);
    acc.score += grav.collectedIds.length * 100;
    acc.itemsCollected += grav.collectedIds.length;
    acc.frames.push({
      board: cloneBoard(b), clearingIds: [], bornIds: [], spawnIds: grav.spawnIds,
      collectedIds: grav.collectedIds, stonesHit: [], points: grav.collectedIds.length * 100, cascade: 1,
    });
    resolveCascade(b, cfg, rng, acc, null);
    acc.maxCascade = Math.max(acc.maxCascade, 1);
    return finalize(acc);
  }

  // special + special combos
  if (ta.special !== 'none' && td.special !== 'none') {
    const b = cloneBoard(board);
    const r = Math.floor(d / b.w);
    const c = d % b.w;
    const initialClear = [a, d];
    if (ta.special === 'rocketH' && td.special === 'rocketH') {
      for (let cc = 0; cc < b.w; cc++) initialClear.push(idxOf(b, r, cc));
      for (let rr = 0; rr < b.h; rr++) initialClear.push(idxOf(b, rr, c));
    } else {
      for (let rr = r - 2; rr <= r + 2; rr++)
        for (let cc = c - 2; cc <= c + 2; cc++) {
          if (rr < 0 || rr >= b.h || cc < 0 || cc >= b.w) continue;
          initialClear.push(idxOf(b, rr, cc));
        }
    }
    const queue = initialClear.filter((i) => {
      const t = b.cells[i] ? b.cells[i].tile : null;
      return !!t && t.special !== 'none' && i !== a && i !== d;
    });
    return applyBlastMove(b, cfg, rng, initialClear, queue, 200, cfg.items);
  }

  // normal swap
  if (!createsMatchAfterSwap(board, a, d)) return EMPTY_MOVE;
  const b = cloneBoard(board);
  swapTiles(b, a, d);
  acc.frames.push({ board: cloneBoard(b), clearingIds: [], bornIds: [], spawnIds: [], collectedIds: [], stonesHit: [], points: 0, cascade: 0 });
  resolveCascade(b, cfg, rng, acc, d);
  return finalize(acc);
}

function finalize(acc) {
  return {
    valid: true, frames: acc.frames, score: acc.score, colorsCollected: acc.colorsCollected,
    itemsCollected: acc.itemsCollected, stonesDestroyed: acc.stonesDestroyed,
    maxCascade: acc.maxCascade, shuffled: acc.shuffled,
  };
}

function tryTap(board, r, c, cfg, rng) {
  const cell = cellAt(board, r, c);
  if (!cell || !cell.tile || cell.tile.kind !== 'gem') return EMPTY_MOVE;
  const color = cell.tile.color;
  if (color < 0) return EMPTY_MOVE;
  const group = [];
  const seen = new Set();
  const stack = [idxOf(board, r, c)];
  seen.add(idxOf(board, r, c));
  while (stack.length > 0) {
    const i = stack.pop();
    group.push(i);
    const rr = Math.floor(i / board.w), cc = i % board.w;
    for (const [dr, dc] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) {
      const nr = rr + dr, nc = cc + dc;
      if (nr < 0 || nr >= board.h || nc < 0 || nc >= board.w) continue;
      const ni = idxOf(board, nr, nc);
      if (seen.has(ni)) continue;
      const nCell = board.cells[ni];
      if (nCell && nCell.tile && nCell.tile.kind === 'gem' && nCell.tile.color === color) {
        seen.add(ni);
        stack.push(ni);
      }
    }
  }
  if (group.length < 2) return EMPTY_MOVE;
  const b = cloneBoard(board);
  const initialClear = [...group];
  const queue = [];
  for (const i of group) {
    const t = b.cells[i].tile;
    if (t.special !== 'none') queue.push(i);
  }
  if (group.length >= 5) {
    const rr = Math.floor(group[0] / b.w), cc = group[0] % b.w;
    for (let dr = -1; dr <= 1; dr++)
      for (let dc = -1; dc <= 1; dc++) {
        const nr = rr + dr, nc = cc + dc;
        if (nr < 0 || nr >= b.h || nc < 0 || nc >= b.w) continue;
        const ni = idxOf(b, nr, nc);
        if (!initialClear.includes(ni)) initialClear.push(ni);
        const t = b.cells[ni] ? b.cells[ni].tile : null;
        if (t && t.special !== 'none' && !queue.includes(ni)) queue.push(ni);
      }
  }
  const basePoints = group.length * 15 + (group.length >= 5 ? 100 : 0);
  return applyBlastMove(b, cfg, rng, initialClear, queue, basePoints, cfg.items);
}

/* ---------------- Boosters ---------------- */
function hammerHit(board, r, c, cfg, rng) {
  const cell = cellAt(board, r, c);
  if (!cell) return EMPTY_MOVE;
  if (cell.blocker) {
    const b = cloneBoard(board);
    const target = b.cells[idxOf(b, r, c)];
    target.blocker.hp--;
    let destroyed = false;
    if (target.blocker.hp <= 0) { target.blocker = null; destroyed = true; }
    const acc = emptyAcc(cfg.items);
    acc.frames.push({
      board: cloneBoard(b), clearingIds: [], bornIds: [], spawnIds: [],
      collectedIds: [], stonesHit: [idxOf(b, r, c)], points: 50, cascade: 1,
    });
    if (destroyed) acc.stonesDestroyed++;
    acc.score += 50;
    return finalize(acc);
  }
  if (!cell.tile) return EMPTY_MOVE;
  const b = cloneBoard(board);
  const i = idxOf(b, r, c);
  const t = b.cells[i].tile;
  if (t.special !== 'none') return applyBlastMove(b, cfg, rng, [], [i], 60, cfg.items);
  return applyBlastMove(b, cfg, rng, [i], [], 60, cfg.items);
}

function crossBlast(board, r, c, cfg, rng) {
  const b = cloneBoard(board);
  const initialClear = [];
  for (let cc = 0; cc < b.w; cc++) initialClear.push(idxOf(b, r, cc));
  for (let rr = 0; rr < b.h; rr++) initialClear.push(idxOf(b, rr, c));
  const queue = initialClear.filter((i) => {
    const t = b.cells[i] ? b.cells[i].tile : null;
    return !!t && t.special !== 'none';
  });
  return applyBlastMove(b, cfg, rng, initialClear, queue, 120, cfg.items);
}

function bombBlast(board, r, c, cfg, rng) {
  const b = cloneBoard(board);
  const initialClear = [];
  for (let rr = r - 1; rr <= r + 1; rr++)
    for (let cc = c - 1; cc <= c + 1; cc++) {
      if (rr < 0 || rr >= b.h || cc < 0 || cc >= b.w) continue;
      initialClear.push(idxOf(b, rr, cc));
    }
  const queue = initialClear.filter((i) => {
    const t = b.cells[i] ? b.cells[i].tile : null;
    return !!t && t.special !== 'none';
  });
  return applyBlastMove(b, cfg, rng, initialClear, queue, 120, cfg.items);
}

function shuffleBoard(board, cfg, rng) {
  const b = cloneBoard(board);
  shuffleGems(b, rng);
  const acc = emptyAcc(cfg.items);
  acc.frames.push({ board: b, clearingIds: [], bornIds: [], spawnIds: [], collectedIds: [], stonesHit: [], points: 0, cascade: 0 });
  return finalize(acc);
}

/* ---------------- Move availability / shuffle ---------------- */
function hasAnyMove(board, mode) {
  if (mode === 'tap') {
    for (let r = 0; r < board.h; r++) {
      for (let c = 0; c < board.w; c++) {
        const col = gemColor(board, r, c);
        if (col < 0) continue;
        if (gemColor(board, r + 1, c) === col || gemColor(board, r, c + 1) === col) return true;
      }
    }
    return false;
  }
  for (let r = 0; r < board.h; r++) {
    for (let c = 0; c < board.w; c++) {
      const i = idxOf(board, r, c);
      const t = tileAt(board, r, c);
      if (!t || !isMovable(t)) continue;
      if (t.special === 'rainbow') {
        for (const [dr, dc] of [[-1, 0], [1, 0], [0, -1], [0, 1]]) {
          const n = tileAt(board, r + dr, c + dc);
          if (n && isMovable(n)) return true;
        }
        continue;
      }
      for (const [dr, dc] of [[0, 1], [1, 0]]) {
        const nr = r + dr, nc = c + dc;
        const nt = tileAt(board, nr, nc);
        if (!nt || !isMovable(nt)) continue;
        if (nt.special === 'rainbow') return true;
        if (createsMatchAfterSwap(board, i, idxOf(board, nr, nc))) return true;
      }
    }
  }
  return false;
}

function shuffleGems(board, rng) {
  const positions = [];
  const tiles = [];
  for (let i = 0; i < board.cells.length; i++) {
    const cell = board.cells[i];
    if (cell && cell.tile && cell.tile.kind === 'gem') {
      positions.push(i);
      tiles.push(cell.tile);
    }
  }
  if (positions.length < 2) return;
  let best = null;
  for (let attempt = 0; attempt < 30; attempt++) {
    const order = [...tiles];
    for (let i = order.length - 1; i > 0; i--) {
      const j = Math.floor(rng() * (i + 1));
      [order[i], order[j]] = [order[j], order[i]];
    }
    positions.forEach((p, k) => { board.cells[p].tile = order[k]; });
    const runs = findRuns(board).length;
    const moves = hasAnyMove(board, 'swap');
    if (runs === 0 && moves) return;
    if (best === null) best = order;
  }
  if (best) {
    positions.forEach((p, k) => { board.cells[p].tile = best[k]; });
  }
}

let audioCtx = null;
let soundEnabled = true;
function setSoundEnabled(v) { soundEnabled = v; }
function ac() {
  if (!soundEnabled) return null;
  if (typeof window === 'undefined') return null;
  if (!audioCtx) {
    try {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    } catch (e) { return null; }
  }
  if (audioCtx.state === 'suspended') void audioCtx.resume();
  return audioCtx;
}
function tone(freq, dur, type, vol, delay) {
  const c = ac();
  if (!c) return;
  const t0 = c.currentTime + (delay || 0);
  const osc = c.createOscillator();
  const gain = c.createGain();
  osc.type = type || 'sine';
  osc.frequency.value = freq;
  gain.gain.setValueAtTime(vol || 0.08, t0);
  gain.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  osc.connect(gain).connect(c.destination);
  osc.start(t0);
  osc.stop(t0 + dur + 0.02);
}

/* ---------------- player store (zustand-compatible save) ---------------- */
const SAVE_KEY = 'blooming-world-save-v1';
const DEFAULT_BOOSTERS = { hammer: 1, bomb: 0, cross: 0, shuffle: 1, undo: 0, moves5: 0 };
function defaultState() {
  return {
    name: '', lang: 'ru', sound: true, coins: 300, stars: {}, scores: {},
    boosters: Object.assign({}, DEFAULT_BOOSTERS),
    owned: {
      skins: ['classic', 'stones'], avatars: ['av-seed', 'av-flower'],
      frames: ['fr-none'], nameStyles: ['ns-basic'], effects: [],
    },
    equipped: { skin: 'classic', avatar: 'av-seed', frame: 'fr-none', nameStyle: 'ns-basic', tileEffect: '', avatarEffect: '', nameEffect: '' },
    stats: { wins: 0, bestCascade: 0, totalScore: 0, movesMade: 0 },
  };
}
function normalizeState(s) {
  const d = defaultState();
  const out = Object.assign({}, d, s || {});
  out.stars = Object.assign({}, s && s.stars ? s.stars : {});
  out.scores = Object.assign({}, s && s.scores ? s.scores : {});
  out.boosters = Object.assign({}, DEFAULT_BOOSTERS, s && s.boosters ? s.boosters : {});
  out.owned = Object.assign({}, d.owned, s && s.owned ? s.owned : {});
  out.equipped = Object.assign({}, d.equipped, s && s.equipped ? s.equipped : {});
  out.stats = Object.assign({}, d.stats, s && s.stats ? s.stats : {});
  out.lang = out.lang === 'en' ? 'en' : 'ru';
  return out;
}
function loadState() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (!raw) return defaultState();
    const parsed = JSON.parse(raw);
    return normalizeState(parsed && parsed.state ? parsed.state : parsed);
  } catch (e) { return defaultState(); }
}
function saveState() {
  try {
    const inner = Object.assign({}, App.player);
    localStorage.setItem(SAVE_KEY, JSON.stringify({ state: inner, version: 0 }));
  } catch (e) { /* storage unavailable — play without persistence */ }
}
/* store actions (mutate App.player + persist) */
const store = {
  t(key, vars) { return translate(App.player.lang, key, vars); },
  setLang(l) { App.player.lang = l; saveState(); },
  setSound(v) { setSoundEnabled(v); App.player.sound = v; saveState(); },
  setName(n) { App.player.name = String(n).slice(0, 16); saveState(); },
  addCoins(n) { App.player.coins += n; saveState(); },
  spendCoins(n) {
    if (App.player.coins < n) return false;
    App.player.coins -= n; saveState(); return true;
  },
  recordWin(level, stars, score, maxCascade, movesUsed) {
    const s = App.player;
    const prevStars = s.stars[level] || 0;
    const firstClear = !(level in s.stars);
    const newStars = stars > prevStars;
    const chapter = chapterOfLevel(level);
    const reward = firstClear ? 30 + stars * 10 + chapter * 5 : 10 + stars * 5;
    s.stars[level] = Math.max(prevStars, stars);
    s.scores[level] = Math.max(s.scores[level] || 0, score);
    s.coins += reward;
    s.stats.wins += 1;
    s.stats.bestCascade = Math.max(s.stats.bestCascade, maxCascade);
    s.stats.totalScore += score;
    s.stats.movesMade += movesUsed;
    saveState();
    return { firstClear, newStars, reward };
  },
  addBooster(id, n) { App.player.boosters[id] = (App.player.boosters[id] || 0) + n; saveState(); },
  useBooster(id) {
    const s = App.player;
    if ((s.boosters[id] || 0) <= 0) return false;
    s.boosters[id]--; saveState(); return true;
  },
  buyBooster(id) {
    const s = App.player;
    const price = BOOSTER_MAP[id].price;
    if (s.coins < price) return false;
    s.coins -= price;
    s.boosters[id] = (s.boosters[id] || 0) + 1;
    saveState(); return true;
  },
  buyCosmetic(kind, id, price) {
    const s = App.player;
    if (s.owned[kind].includes(id)) return false;
    if (s.coins < price) return false;
    s.coins -= price;
    s.owned[kind].push(id);
    saveState(); return true;
  },
  equip(kind, id) { App.player.equipped[kind] = id; saveState(); },
  maxUnlocked() {
    const s = App.player;
    const levels = Object.keys(s.stars).map(Number);
    const cleared = levels.length > 0 ? Math.max.apply(null, levels) : 0;
    return Math.min(TOTAL_LEVELS, cleared + 1);
  },
  totalStars() {
    const vals = Object.values(App.player.stars);
    return vals.reduce((a, b) => a + b, 0);
  },
  resetAll() {
    const keepLang = App.player.lang;
    App.player = normalizeState(defaultState());
    App.player.lang = keepLang;
    setSoundEnabled(App.player.sound);
    saveState();
  },
};

/* ---------------- tiny dom helpers ---------------- */
function el(tag, cls, text) {
  const n = document.createElement(tag);
  if (cls) n.className = cls;
  if (text !== undefined && text !== null) n.textContent = text;
  return n;
}
function fmt(n) { return Number(n).toLocaleString('ru-RU'); }
function shade(hex, amount) {
  const n = hex.replace('#', '');
  const r = Math.max(0, Math.min(255, parseInt(n.slice(0, 2), 16) + amount));
  const g = Math.max(0, Math.min(255, parseInt(n.slice(2, 4), 16) + amount));
  const b = Math.max(0, Math.min(255, parseInt(n.slice(4, 6), 16) + amount));
  return '#' + r.toString(16).padStart(2, '0') + g.toString(16).padStart(2, '0') + b.toString(16).padStart(2, '0');
}
const SPECIAL_GLYPH = { rocketH: '⇢', rocketV: '⇣', bomb: '✹', rainbow: '❈' };
const RAINBOW_BG = 'conic-gradient(#c74134,#f6e04b,#2ea56d,#3d9be0,#b06fc9,#ef8f2a,#c74134)';
const ITEM_BG = 'linear-gradient(160deg,#a5825a,#7c5c3a 55%,#5c4326)';

/**
 * Tile markup. anim: '' | 'pop' | 'born' | 'fall' (wobble auto by era)
 * scale: 1 (board) — uses cqw units; container must have container-type.
 */
function tileHtml(tile, theme, skin, anim) {
  const st = theme.tile;
  const palette = skin.palette || theme.palette;
  const isRainbow = tile.color === -1;
  const isItem = tile.kind === 'item';
  const colorIdx = Math.max(0, Math.min(5, tile.color));
  const base = palette[colorIdx] || '#999999';
  const dark = shade(base, -46);
  const light = shade(base, 42);

  let shape;
  if (isRainbow) shape = 'border-radius:50%;';
  else if (isItem) shape = 'border-radius:26%;';
  else {
    const s = gemShapeCss(tile.color);
    shape = (s.clipPath ? 'clip-path:' + s.clipPath + ';' : '') + 'border-radius:' + s.borderRadius + ';';
  }

  let background;
  if (isRainbow) background = RAINBOW_BG;
  else if (isItem) background = ITEM_BG;
  else if (skin.glyphs || st.gradient) background = 'linear-gradient(160deg, ' + light + ', ' + base + ' 55%, ' + dark + ')';
  else background = base;

  const rimInset = Math.round((0.06 - st.rimWidth) * 100);
  const rimFilters = [];
  if (st.pixelShadow && !st.softShadow) rimFilters.push('drop-shadow(0.08em 0.08em 0 rgba(0,0,0,.4))');
  if (st.softShadow) rimFilters.push('drop-shadow(0 0.07em 0.12em rgba(0,0,0,.35))');
  const glowColor = isItem ? '#a5825a' : base;
  const fillFilters = st.glow
    ? ['drop-shadow(0 0 0.2em ' + glowColor + ')', 'drop-shadow(0 0 0.42em ' + glowColor + '55)']
    : [];

  let cls = 'tile-root';
  if (anim === 'pop') cls += ' bm-pop';
  else if (anim === 'born') cls += ' bm-born';
  else if (anim === 'fall') cls += ' bm-fall-in';
  else if (st.wobble) cls += ' bm-wobble';
  if (isRainbow) cls += ' bm-rainbow-spin';
  else if (tile.special !== 'none') cls += ' bm-special-pulse';

  let inner = '';
  if (st.rimWidth > 0) {
    inner += '<div class="tile-rim" style="inset:' + rimInset + '%;background:' + st.rim + ';' + shape +
      (rimFilters.length ? 'filter:' + rimFilters.join(', ') + ';' : '') + '"></div>';
  }
  inner += '<div class="tile-body" style="background:' + background + ';' + shape +
    (st.glass ? 'backdrop-filter:blur(2px);opacity:.9;' : '') +
    (fillFilters.length ? 'filter:' + fillFilters.join(', ') + ';' : '') + '">';
  if (st.pattern === 'pixel') inner += '<div class="bm-pixel-pattern"></div>';
  if (st.pattern === 'rays') inner += '<div style="position:absolute;inset:0;background:repeating-conic-gradient(from 0deg, rgba(255,255,255,.10) 0deg 8deg, transparent 8deg 16deg)"></div>';
  if (st.gloss) inner += '<div style="position:absolute;left:10%;right:10%;top:6%;height:38%;background:linear-gradient(180deg, rgba(255,255,255,.5), rgba(255,255,255,.06))"></div>';
  if (st.shine) inner += '<div class="bm-shine-wrap"><div class="bm-shine-bar"></div></div>';
  if (skin.ring && !isRainbow && !isItem) inner += '<div style="position:absolute;inset:0;background:radial-gradient(closest-side, transparent 56%, rgba(255,255,255,.55) 66%, transparent 78%)"></div>';
  inner += '</div>';

  let over = '';
  if (skin.glyphs && !isRainbow && !isItem) {
    over += '<span class="tile-glyph">' + skin.glyphs[colorIdx] + '</span>';
  }
  if (tile.special !== 'none') {
    over += '<span class="spec-disc"' + (skin.glyphs ? ' style="background:transparent"' : '') + '><span class="spec-glyph">' + SPECIAL_GLYPH[tile.special] + '</span></span>';
  }
  if (isItem) over += '<span class="tile-glyph" style="font-size:48cqw">🌰</span>';

  return '<div class="' + cls + '" style="container-type:size">' + inner +
    '<div class="tile-over">' + over + '</div></div>';
}
